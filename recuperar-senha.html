<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tormenta.css">
    <title>Recuperar Senha - F.A.T.O</title>
</head>

<body>

    <main class="container">

        <form id="recuperarForm">

            <h1>F.A.T.O</h1>

            <p class="subtitulo">
                Recuperar senha
            </p>

            <p class="descricao">
                Digite o e-mail cadastrado na sua conta.
                Enviaremos um link para você redefinir sua senha.
            </p>

            <div class="input-box">
                <input
                    type="email"
                    placeholder="E-mail"
                    required
                >
            </div>

            <button type="submit" class="login">
                Enviar
            </button>

            <div class="register-link">
                <p>
                    Lembrou sua senha?
                    <a href="login.html">Voltar para o login</a>
                </p>
            </div>

        </form>

    </main>

    <script>
        document.getElementById("recuperarForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.");

            window.location.href = "login.html";
        });
    </script>

</body>
</html>
