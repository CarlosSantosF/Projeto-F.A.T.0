<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>Recuperar Senha - F.A.T.O</title>
</head>

<body class="auth">
    <button type="button" class="tema-toggle" id="botaoTema" onclick="alternarModoEscuro()">Modo escuro</button>

    <main class="container">

        <form id="recuperarForm" onsubmit="return recuperarSenha()">

            <h1><a class="titulo-home" href="index.html">F.A.T.O</a></h1>

            <p class="subtitulo">
                Recuperar senha
            </p>

            <p class="descricao">
                Digite o e-mail cadastrado na sua conta.
                Enviaremos um link para você redefinir sua senha.
            </p>

            <div class="input-box">
                <input type="email" placeholder="E-mail" required>
            </div>

            <button type="submit" class="login">
                Enviar
            </button>

            <div class="register-link">
                <p>
                    Lembrou sua senha?
                    <a href="login.html">Voltar para o login</a>
                </p>
            </div>

        </form>

    </main>

    <script src="tema.js"></script>
    <script>
        function recuperarSenha() {
            alert("Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.");
            window.location.href = "login.html";
            return false;
        }
    </script>

</body>
</html>
